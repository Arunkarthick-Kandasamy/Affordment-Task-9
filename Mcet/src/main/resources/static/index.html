<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCET Student Management</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>MCET Student Management</h1>
        <a href="/view.html" class="view-link">View All Students</a>
        
        <!-- Add/Update Form -->
        <div class="form-container">
            <h2>Add/Update Student</h2>
            <form id="studentForm">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="rollnum">Roll Number:</label>
                <input type="text" id="rollnum" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="mobile">Mobile:</label>
                <input type="text" id="mobile" required>
                <button type="submit" id="submitBtn">Add Student</button>
            </form>
        </div>

        <!-- Student List for Delete -->
        <div class="list-container">
            <h2>Existing Students</h2>
            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="/js/script.js"></script>
</body>
</html>
